version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: arogyanova_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arogyanova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arogyanova_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-arogyanova}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arogyanova"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arogyanova_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arogyanova_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: pnpm dev --host

volumes:
  postgres_data:
  upload_data:
